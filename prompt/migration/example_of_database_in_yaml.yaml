
   interessieren:
     grammatic_role: verb
     pronouncation: [ ɪntəʁɛˈsiːʁən ]
     sense:
        - application:
          - sich für jemanden/etwas (Akk.) interessieren:
              persian:
                - به کسی/چیزی علاقه داشتن
                - به کسی/چیزی علاقه‌مند بودن
              english:
                - to be interested in someone/something
              pinglish:
                - be kasi/chizi alagheh dashtan
                - be kasi/chizi alaghemand boodan
              german: 
                 - Interesse an einer Person
                 - sache oder einem Thema haben.
              synonyme: 
                 - Interesse haben an
                 - sich begeistern für
              antonyme:
                - sich nicht interessieren für
            collocation:
             - sich sehr für Politik interessieren
             - sich besonders für Kunst interessieren
              example:
                - Ich interessiere mich für deutsche Geschichte: I am interested in German history.
                - Sie interessiert sich sehr für Kunst: She is very interested in art.
          - jemanden (Akk.) interessieren:
              persian:
                - برای کسی جالب بودن
                - توجه کسی را جلب کردن
              english:
                - to interest someone
              pinglish:
                - baraye kasi jaleb boodan
                - tavajoh-e kasi ra jalb kardan
              german: 
                - bei jemandem Interesse oder Aufmerksamkeit hervorrufen.
              synonyme: ansprechen, neugierig machen
              example:
                - Dieses Thema interessiert mich sehr: This topic interests me a lot.
                - Politik interessiert ihn nicht: Politics does not interest him.


        - adjectiv:
          wichtig [ˈvɪçtɪç] (Adjektiv, Komparativ:wichtiger, superlativ:
            am wichtigsten): important
          persian: مهم
          english: important
          pinglish: mohem
          german: von großer Bedeutung; wesentlich für etwas.
          synonyme: bedeutend, wesentlich
          example:
            Das ist eine wichtige Entscheidung: That is an important decision.
            Dieses Problem ist wichtiger als das andere: This problem is more important than the other one.
            Gesundheit ist am wichtigsten: Health is the most important.
        - adverb:
          oft [ɔft] (Adverb, nicht steigerbar):
            persich:
              - اغلب
              - بیشتر اوقات
            englisch:
              - often
              - frequently
            penglisch:
              - aghlab
              - bishtare oghat

            Bedeutung: viele Male; in regelmäßigen Abständen wiederkehrend.
            Synonyme: häufig, regelmäßig
            example:
              Ich gehe oft ins Fitnessstudio: I often go to the gym.
              Oft denke ich an die Vergangenheit: Often I think about the past.
        - noun:
          exmaples:
            der Student [ʃtuˈdɛnt]:
              english: student
              german: männliche Person, die an einer Universität oder Hochschule studiert.
              feminin: die Studentin
              genitiv: des Studenten
              plural: die Studenten/die Studentinnen
              Synonyme: Studierender, Hochschüler
              example:
                Er ist Student an der Universität Wien: He is a student at the University of Vienna.
                Seine Schwester ist Studentin: His sister is a student.
          die Bank [baŋk]: bank
            Bedeutung: ein Unternehmen, das Geld verwaltet, Kredite vergibt und andere Finanzdienstleistungen anbietet.
            Genitiv: der Bank
            Plural: die Banken
            Kollokation: Geld bei der Bank einzahlen
            Synonyme: Kreditinstitut, Geldinstitut
            example:
              - Ich muss heute zur Bank gehen: I have to go to the bank today.
              - Die Bank hat meinen Kredit genehmigt: The bank approved my loan.

          die Bank [baŋk]: bench
            Bedeutung: eine lange Sitzgelegenheit für mehrere Personen, oft aus Holz oder Metall.
            Genitiv: der Bank
            Plural: die Bänke
            Kollokation: auf einer Bank sitzen
            Synonyme: Sitzbank, Parkbank
            ex:
              - Wir sitzen auf einer Bank im Park: We are sitting on a bench in the park.
              - Neben dem Eingang steht eine Bank: There is a bench next to the entrance.
        - conjunktion:
          examples: null
        - partikel:
          examples: null
