  - for example these words can not be entered individually: |
      der Stamm [ʃtam]: stem; root
      Bedeutung: der unveränderliche Grundteil eines Wortes, an den Endungen oder andere Wortteile angefügt werden können.
      Genitiv: des Stammes
      Plural: die Stämme
      Kollokation: der Stamm eines Wortes
      Synonyme: Wortstamm, Grundform
      ex: „lern-“ ist der Stamm des Verbs „lernen“: “lern-” is the stem of the verb “lernen”.
      ex: An den Stamm werden verschiedene Endungen angefügt: Different endings are added to the stem.

      der Stamm [ʃtam]: trunk
      Bedeutung: der dicke, feste Hauptteil eines Baumes zwischen den Wurzeln und den Ästen.
      Genitiv: des Stammes
      Plural: die Stämme
      Kollokation: der Stamm eines Baumes
      Synonyme: Baumstamm
      ex: Der Stamm dieses Baumes ist sehr dick: The trunk of this tree is very thick.
      ex: Er sitzt auf einem alten Baumstamm: He is sitting on an old tree trunk.

      der Stamm [ʃtam]: tribe
      Bedeutung: eine traditionelle Gruppe von Menschen mit gemeinsamer Herkunft, Kultur oder Sprache.
      Genitiv: des Stammes
      Plural: die Stämme
      Kollokation: einem Stamm angehören
      Synonyme: Volksgruppe, Gemeinschaft
      ex: Dieser Stamm lebt seit Jahrhunderten in dieser Region: This tribe has lived in this region for centuries.
      ex: Die verschiedenen Stämme sprechen unterschiedliche Sprachen: The different tribes speak different languages.
