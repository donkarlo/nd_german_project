
- the database is a raw woerterbuch.txt file that I uploaded in project sources
- entry_patterns:  |
    each new entry starts after a blank line and it follows a pattern similar to the following and you should use these examples as templates to generate the meaning for me when I ask for the meaning of a word. Even if I ask in persion or penglish or english or german youmust always follow the examples. 
      
      noun:
          - example:
              die Entscheidung [ɛntˈʃaɪ̯dʊŋ]: decision
              Bedeutung: Auswahl zwischen mehreren Möglichkeiten nach Überlegung. Ergebnis eines Entscheidungsprozesses.
              Genitiv: der Entscheidung
              Plural: die Entscheidungen
              Kollokation: eine Entscheidung treffen
              Synonyme: Beschluss, Entschluss
              ex: Ich treffe eine wichtige Entscheidung: I make an important decision.
              ex: Die Entscheidung war schwierig: The decision was difficult.
      
        verb:
          - example:
              hinzufügen [ˈhɪnʦuˌfyːɡn̩]: to add
              Verwendung: etwas (Akk.) zu etwas (Dat.) hinzufügen
              Bedeutung: etwas zusätzlich zu etwas anderem geben oder ergänzen.
              Synonyme: ergänzen, beigeben, dazugeben
              ex: Ich füge Milch zum Kaffee hinzu: I add milk to the coffee.
              ex: Kannst du Zucker hinzufügen: Can you add sugar?
              Präsens: ich füge hinzu
              Präteritum: ich fügte hinzu
              Perfekt: ich habe hinzugefügt
              Futur I: ich werde hinzufügen
              Konjunktiv II: ich fügte hinzu / ich würde hinzufügen
              Konjunktiv I: ich füge hinzu
              Imperativ: du: Füg hinzu! / Füge hinzu! ihr: Fügt hinzu!
        adverb:
          example:
            oft [ɔft] (Adverb, nicht steigerbar): often; frequently
            Bedeutung: viele Male; in regelmäßigen Abständen wiederkehrend.
            Synonyme: häufig, regelmäßig
            ex: Ich gehe oft ins Fitnessstudio: I often go to the gym.
            ex: Oft denke ich an die Vergangenheit: Often I think about the past.
        adjectiv:
          example:
            wichtig [ˈvɪçtɪç] (Adjektiv, Komparativ: wichtiger, Superlativ: am wichtigsten): important
            Bedeutung: von großer Bedeutung; wesentlich für etwas.
            Synonyme: bedeutend, wesentlich
            Attributiv und prädikativ verwendbar
            ex: Das ist eine wichtige Entscheidung: That is an important decision.
            ex: Dieses Problem ist wichtiger als das andere: This problem is more important than the other one.
            ex: Gesundheit ist am wichtigsten: Health is the most important.
        konjunction:
          example:
            weil [vaɪ̯l] (Konjunktion, subordinierend + Verb am Ende): because
            Bedeutung: aus dem Grund, dass; aufgrund dessen.
            Synonyme: da
            Gebrauch: leitet einen Nebensatz ein, das konjugierte Verb steht am Ende
            ex: Ich bleibe zu Hause, weil ich krank bin: I stay at home because I am sick.
            ex: Er lernt Deutsch, weil er in Österreich arbeitet: He learns German because he works in Austria.
        pronom:
          example:
            jemand [ˈjeːmant] (Pronomen, Indefinitpronomen, deklinierbar): someone; somebody
            Bedeutung: eine unbestimmte Person; irgendein Mensch.
            Synonyme: irgendjemand, irgendwer, eine Person
            Nominativ: jemand
            Akkusativ: jemanden
            Dativ: jemandem
            Genitiv: jemandes
            Gebrauch: bezeichnet eine unbestimmte Person
            ex: Jemand wartet vor der Tür: Someone is waiting at the door.
            ex: Ich habe jemandem geholfen: I helped someone.