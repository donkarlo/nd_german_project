zurechtweisen (jdn.):
  meaning: "zurechtweisen (jdn.): to reprimand / to scold . sarzanesh kardan"
  example:
    - "Der Lehrer weist den Schüler zurecht: The teacher reprimands the student"
    - "Sie hat mich gestern zurechtgewiesen: She scolded/reprimanded me yesterday"
  conjugation:
    Präsens: "ich weise jdn. zurecht"
    Präteritum: "ich wies jdn. zurecht"
    Perfekt: "ich habe jdn. zurechtgewiesen"
    Futur I: "ich werde jdn. zurechtweisen"
    Konjunktiv II: "ich würde jdn. zurechtweisen"
    Konjunktiv I: "ich weise jdn. zurecht (Konjunktivform bleibt gleich)"
bedauern (etw.Akk ~):
  meaning: to regret; to be sorry for
  example:
    - "Ich bedauere meinen Fehler: I regret my mistake."
    - "Wir bedauern die Entscheidung sehr: We regret the decision very much."
  conjugation:
    Präsens: "ich bedauere"
    Präteritum: "ich bedauerte"
    Perfekt: "ich habe bedauert"
    Futur I: "ich werde bedauern"
    Konjunktiv II: "ich würde bedauern"
    Konjunktiv I: "ich bedauere"
  der Geist (pl. die Geister):
    plural: "Geister"
    feminin: "Geiste"
    meaning: "mind/spirit"
    example:
      - "Mein Geist ist ruhig: My mind is calm"
      - "Sie hat einen scharfen Geist: She has a sharp mind"